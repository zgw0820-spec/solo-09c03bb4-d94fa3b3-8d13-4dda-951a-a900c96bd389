services:
  log-search:
    build: .
    image: log-search-gateway:local
    container_name: log-search-gateway
    ports:
      - "8000:8000"
    environment:
      BACKEND_STARTUP_TIMEOUT_S: "5"
      BACKEND_IDLE_TIMEOUT_S: "10"
      BACKEND_DATA_DIR: "/srv/data/state"
      BACKEND_LOG_FILE: "/srv/data/sample_logs.jsonl"
      BACKEND_DRILL_LOG_FILE: "/srv/data/drill_gateway_logs.jsonl"
    volumes:
      - log-search-state:/srv/data/state
    restart: unless-stopped
    # The backend child is spawned by the web process; make sure SIGTERM has
    # time to reap it before the engine force-kills the container.
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  log-search-state:
